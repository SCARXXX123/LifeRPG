<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');

        :root {
            --neon-blue: #3b82f6;
            --neon-red: #ef4444;
            --terminal-green: #10b981;
        }

        body {
            background: #020205; color: #fff; font-family: 'JetBrains Mono', monospace;
            height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .glass-panel {
            background: rgba(10, 10, 15, 0.8); border: 1px solid rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(25px); box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .input-container { position: relative; transition: all 0.3s ease; }
        .input-container::before {
            content: ''; position: absolute; left: -2px; top: 50%; height: 0%; width: 2px;
            background: var(--neon-blue); transition: all 0.4s;
        }
        .input-container:focus-within::before { top: 0; height: 100%; box-shadow: 0 0 15px var(--neon-blue); }

        .input-error::before { background: var(--neon-red) !important; height: 100%; top: 0; box-shadow: 0 0 15px var(--neon-red); }

        .scan-anim {
            width: 100%; height: 4px; background: linear-gradient(to bottom, transparent, var(--neon-blue), transparent);
            position: absolute; top: -10%; left: 0; opacity: 0.5; animation: scan-move 3s linear infinite;
        }

        @keyframes scan-move { 0% { top: -10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 110%; opacity: 0; } }

        .log-text { font-size: 9px; color: rgba(59, 130, 246, 0.5); }
        .log-error { color: var(--neon-red); font-weight: bold; }

        #error-toast {
            position: fixed; top: 2rem; right: -100%; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--neon-red);
            padding: 1rem 2rem; border-radius: 1rem; backdrop-filter: blur(10px); z-index: 100;
        }
        #error-toast.show { right: 2rem; }

        /* 自定义下拉框样式，防止原生样式破坏氛围 */
        select option { background: #0a0a0f; color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-0">
    <div class="bg-grid"></div>

    <div class="absolute top-8 left-8 z-50 flex items-center gap-4">
        <button onclick="window.pywebview.api.navigate('index')"
                class="group flex items-center space-x-2 text-zinc-500 hover:text-blue-500 transition-colors">
            <span class="text-xs font-bold tracking-[0.4em] uppercase border border-zinc-800 group-hover:border-blue-500/50 px-3 py-1 bg-black/50" data-lang="back_to_home">
                回到首页
            </span>
        </button>
        <button id="lang-btn" class="px-4 py-2 border border-blue-500/30 text-blue-500 text-xs uppercase tracking-wider hover:border-blue-500 hover:bg-blue-500/10 transition-all">
            ENGLISH
        </button>
    </div>

    <div id="error-toast" class="flex items-center space-x-3">
        <div class="w-2 h-2 bg-red-500 animate-ping rounded-full"></div>
        <span id="error-msg" class="text-red-500 font-bold text-sm tracking-tighter uppercase">ACCESS_DENIED</span>
    </div>

    <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-12 gap-8 items-start relative">
        <div class="hidden md:flex col-span-3 flex-col space-y-4 opacity-40">
            <div class="space-y-1">
                <p class="log-text">>>> STACK_INFO: INITIALIZE_v2</p>
                <p class="log-text">>>> ENCRYPTION: AES_256_LOCAL</p>
                <p id="engine-log" class="log-text">>>> ENGINE: PENDING...</p>
            </div>
            <div class="h-80 border-l border-blue-900/30 pl-4 space-y-2 overflow-hidden" id="mini-logs"></div>
        </div>

        <div class="col-span-1 md:col-span-9 space-y-8">
            <div class="space-y-1">
                <div class="flex items-center space-x-2">
                    <span class="w-8 h-[1px] bg-blue-500"></span>
                    <p class="text-blue-500 text-[10px] tracking-[0.6em] font-bold uppercase" data-lang="subject_registry">Subject_Registry</p>
                </div>
                <h1 class="text-6xl font-black tracking-tighter italic text-white leading-none" data-lang="sign_contract">签署数字化契约</h1>
            </div>

            <div class="glass-panel p-8 md:p-10 rounded-[2rem] relative overflow-hidden group">
                <div class="scan-anim group-hover:block hidden"></div>

                <div class="space-y-6 relative z-10">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="input-container space-y-2">
                            <label class="text-[9px] text-zinc-500 uppercase tracking-[0.4em] ml-1" data-lang="subject_id">Subject_ID</label>
                            <input id="input-name" type="text" placeholder="Scar" data-placeholder="name_placeholder"
                                   class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-xl font-black outline-none focus:bg-blue-500/5 transition-all">
                        </div>
                        <div class="input-container space-y-2">
                            <label class="text-[9px] text-zinc-500 uppercase tracking-[0.4em] ml-1" data-lang="access_key">Access_Key</label>
                            <input id="input-password" type="password" placeholder="****" data-placeholder="password_placeholder"
                                   class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-xl font-black outline-none focus:bg-blue-500/5 transition-all">
                        </div>
                        <div class="input-container space-y-2">
                            <label class="text-[9px] text-zinc-500 uppercase tracking-[0.4em] ml-1" data-lang="neural_engine">Neural_Engine</label>
                            <select id="select-model"
                                    class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-lg font-black outline-none focus:bg-blue-500/5 text-blue-500 cursor-pointer transition-all">
                                <option value="deepseek-v3" data-lang="deepseek_v3">DEEPSEEK-V3</option>
                                <option value="qwen" data-lang="qwen">Qwen</option>

                            </select>
                        </div>
                    </div>

                    <div class="input-container space-y-2">
                        <label class="text-[9px] text-zinc-500 uppercase tracking-[0.4em] ml-1" data-lang="biological_history">Biological_History (Description)</label>
                        <textarea id="input-desc" rows="4" data-placeholder="desc_placeholder"
                                  placeholder="在此输入你的技术栈或近期状态，AI 将以此进行人格建模..."
                                  class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-zinc-300 leading-relaxed resize-none outline-none focus:bg-blue-500/5 transition-all"></textarea>
                    </div>

                    <div class="pt-2">
                        <button id="btn-execute" onclick="triggerInit()"
                                class="group relative w-full py-5 bg-blue-600 rounded-2xl overflow-hidden transition-all hover:bg-blue-500 active:scale-[0.98]">
                            <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            <span class="relative z-10 font-black text-xl tracking-tighter italic uppercase" data-lang="execute_contract">确认签署 (EXECUTE_CONTRACT)</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="loading-box" class="hidden flex items-center space-x-6 px-4">
                <div class="w-10 h-10 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <div>
                    <p id="status-text" class="text-blue-500 text-xs tracking-[0.3em] font-bold uppercase animate-pulse" data-lang="neural_mapping">Neural_Mapping_In_Progress...</p>
                    <p id="sub-status" class="text-zinc-700 text-[9px] uppercase mt-1" data-lang="downloading_data">Downloading cognitive data from Neural Engine...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addLog(text, isError = false) {
            const container = document.getElementById('mini-logs');
            const p = document.createElement('p');
            p.className = `log-text lowercase opacity-0 transition-opacity duration-300 ${isError ? 'log-error' : ''}`;
            p.innerText = `> ${isError ? '[!] ' : ''}${text}`;
            container.prepend(p);
            setTimeout(() => p.classList.remove('opacity-0'), 10);
        }

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.add('show');
            addLog(msg, true);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function triggerInit() {
            const name = document.getElementById('input-name').value;
            const password = document.getElementById('input-password').value;
            const desc = document.getElementById('input-desc').value;
            const model = document.getElementById('select-model').value;

            const btn = document.getElementById('btn-execute');
            const loader = document.getElementById('loading-box');

            if (!name || !password || !desc) {
                showError(langData[currentLang].missing_data);
                return;
            }

            // 更新左侧日志状态
            document.getElementById('engine-log').innerText = `>>> ENGINE: ${model.toUpperCase()}`;

            btn.parentElement.classList.add('hidden');
            loader.classList.remove('hidden');
            addLog(`Connecting to ${model.toUpperCase()}...`);

            try {
                // 调用 Python API: 传入 name, password, desc, model
                const success = await window.pywebview.api.init_hero(name, password, desc, model);

                if (success) {
                    addLog("Neural link verified.");
                    document.getElementById('status-text').innerText = "ARCHIVE_STABILIZED";
                } else {
                    throw new Error(langData[currentLang].modeling_failed);
                }
            } catch (err) {
                showError(langData[currentLang].system_crash + err.message);
                btn.parentElement.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        addLog("Kernel initialized...");
        addLog("Waiting for Subject registry...");

        // Language switching
        const langData = {
            zh: {
                back_to_home: '回到首页',
                subject_registry: 'Subject_Registry',
                sign_contract: '签署数字化契约',
                subject_id: 'Subject_ID',
                name_placeholder: 'Scar',
                access_key: 'Access_Key',
                password_placeholder: '****',
                neural_engine: 'Neural_Engine',
                qwen: 'Qwen',
                deepseek_v3: 'DEEPSEEK-V3',
                biological_history: 'Biological_History (Description)',
                desc_placeholder: '在此输入你的技术栈或近期状态，AI 将以此进行人格建模...',
                execute_contract: '确认签署 (EXECUTE_CONTRACT)',
                neural_mapping: 'Neural_Mapping_In_Progress...',
                downloading_data: 'Downloading cognitive data from Neural Engine...',
                missing_data: 'MISSING_DATA: 请填写所有必要参数',
                system_crash: 'SYSTEM_CRASH: ',
                modeling_failed: '建模失败，请检查网络或配置'
            },
            en: {
                back_to_home: 'Back to Home',
                subject_registry: 'Subject_Registry',
                sign_contract: 'Sign Digital Contract',
                subject_id: 'Subject_ID',
                name_placeholder: 'Scar',
                access_key: 'Access_Key',
                password_placeholder: '****',
                neural_engine: 'Neural_Engine',
                qwen: 'Qwen',
                deepseek_v3: 'DEEPSEEK-V3',
                biological_history: 'Biological_History (Description)',
                desc_placeholder: 'Enter your tech stack or recent status here, AI will model your personality based on this...',
                execute_contract: 'Confirm Signing (EXECUTE_CONTRACT)',
                neural_mapping: 'Neural_Mapping_In_Progress...',
                downloading_data: 'Downloading cognitive data from Neural Engine...',
                missing_data: 'MISSING_DATA: Please fill in all required parameters',
                system_crash: 'SYSTEM_CRASH: ',
                modeling_failed: 'Modeling failed, please check network or configuration'
            }
        };

        let currentLang = 'zh';

        function changeLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'ENGLISH' : '中文';
            
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                if (langData[currentLang][key]) {
                    element.textContent = langData[currentLang][key];
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-placeholder]').forEach(element => {
                const key = element.getAttribute('data-placeholder');
                if (langData[currentLang][key]) {
                    element.placeholder = langData[currentLang][key];
                }
            });
        }

        document.getElementById('lang-btn').addEventListener('click', changeLanguage);
    </script>
</body>
</html>
