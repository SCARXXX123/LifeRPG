<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');

        body {
            background: #010103; color: #fff; font-family: 'JetBrains Mono', monospace;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at center, rgba(16, 24, 64, 0.4) 0%, rgba(1, 1, 3, 1) 70%);
        }

        /* 3D Container */
        #game-grid { perspective: 1500px; }

        .menu-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease-out; /* Smooth follow mouse */
            position: relative; overflow: hidden;
            transform-style: preserve-3d; /* Required for tilt */
        }

        /* Hover State */
        .menu-card:hover {
            border-color: rgba(59, 130, 246, 0.6);
            background: rgba(15, 15, 25, 1);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(59, 130, 246, 0.2);
        }

        /* Moving Holographic Gradient on Hover */
        .menu-card::after {
            content: ''; position: absolute; inset: -150%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            transition: opacity 0.3s; opacity: 0; pointer-events: none;
        }
        .menu-card:hover::after { opacity: 1; }

        /* Icon Animation */
        .game-icon { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateZ(20px); }
        .menu-card:hover .game-icon { transform: translateZ(50px) scale(1.1); }

        /* Game Elements */
        .scanline {
            width: 100%; height: 2px;
            background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.4), transparent);
            position: absolute; top: -100%; left: 0; pointer-events: none;
            animation: scan-move 4s linear infinite;
        }
        @keyframes scan-move { 0% { top: -100%; } 100% { top: 200%; } }

        .pulse-tag { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .log-entry { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-8 md:p-12">

    <div class="flex justify-between items-start mb-16 relative z-10">
        <div class="space-y-1">
            <p class="text-blue-500 text-[10px] tracking-[0.8em] font-bold uppercase">Main_Dashboard</p>
            <h1 class="text-5xl font-black italic tracking-tighter text-white" data-lang="dashboard_title">控制中枢</h1>
        </div>
        <div class="flex items-end gap-8">
            <div class="text-right space-y-2 flex flex-col items-end">
                <div class="flex items-center space-x-2 px-3 py-1 border border-emerald-500/30 rounded text-[9px] text-emerald-500 font-bold uppercase tracking-widest">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full pulse-tag"></span>
                    <span>SYSTEM_ONLINE</span>
                </div>
                <p id="clock" class="text-zinc-600 text-xs font-bold"></p>
            </div>
            <button id="lang-btn" class="px-4 py-2 border border-blue-500/30 text-blue-500 text-xs uppercase tracking-wider hover:border-blue-500 hover:bg-blue-500/10 transition-all">
                ENGLISH
            </button>
        </div>
    </div>

    <div id="game-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto w-full flex-1">

        <div onclick="window.pywebview.api.navigate('analyze')"
             class="menu-card rounded-[2.5rem] p-10 cursor-pointer group flex flex-col justify-between border-blue-500/10">
            <div class="scanline"></div>

            <div class="flex justify-between items-center mb-6">
                <span class="text-[9px] text-zinc-600 uppercase tracking-widest font-bold">ANALYSIS_CORE</span>
                <span class="text-[9px] bg-blue-500/20 text-blue-500 px-3 py-1 rounded-full uppercase font-bold pulse-tag">Live_Data</span>
            </div>

            <div class="h-32 flex items-center justify-center">
                <svg class="w-20 h-20 text-blue-500 game-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>

            <div class="mt-8">
                <h2 class="text-3xl font-black italic mb-2 tracking-tight" data-lang="behavior_audit">行为审计</h2>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest leading-relaxed" data-lang="audit_desc">Quantify your digital footprint via AW</p>
            </div>
        </div>

        <div onclick="window.pywebview.api.get_character_init_data().then(() => { location.href='character.html' })"
             class="menu-card rounded-[2.5rem] p-10 cursor-pointer group flex flex-col justify-between border-blue-500/30">
            <div class="flex justify-between items-center mb-6">
                <span class="text-[9px] text-zinc-600 uppercase tracking-widest font-bold">SUBJECT_V3</span>
                <span class="text-blue-500 font-black text-sm italic">User</span>
            </div>
            <div class="h-32 flex items-center justify-center">
                <svg class="w-20 h-20 text-white game-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <div class="mt-8">
                <h2 class="text-3xl font-black italic mb-2 tracking-tight" data-lang="digital_avatar">数字化身</h2>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest leading-relaxed" data-lang="avatar_desc">Neural Mapping Archive [Status: SECURE]</p>
            </div>
        </div>

        <div onclick="location.href='settings.html'"
     class="menu-card rounded-[2.5rem] p-10 cursor-pointer group flex flex-col justify-between border-blue-500/10">
    <div class="scanline"></div>
    <div class="flex justify-between items-center mb-6">
        <span class="text-[9px] text-zinc-600 uppercase tracking-widest font-bold">SYSTEM_CONFIG</span>
        <span class="text-[9px] text-blue-500/60 font-black uppercase tracking-tighter italic">V1.0_Stable</span>
    </div>
    <div class="h-32 flex items-center justify-center">
        <svg class="w-20 h-20 text-blue-500 game-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
    </div>
    <div class="mt-8">
        <h2 class="text-3xl font-black italic mb-2 tracking-tight" data-lang="settings">高级设置</h2>
        <p class="text-zinc-500 text-[10px] uppercase tracking-widest leading-relaxed" data-lang="settings_desc">Neural Tuning & Source Dispatcher</p>
    </div>
</div>

    </div>

    <div class="border-t border-white/5 pt-6 mt-12 flex justify-between items-center text-[10px] text-zinc-700 uppercase tracking-[0.3em]">
        <div id="live-log" class="space-y-1 h-8 overflow-hidden">
            <p class="log-entry text-blue-900">SYSTEM ARCHIVE SECURED</p>
        </div>
        <div class="text-zinc-800 flex items-center space-x-2">
            <span>Kernel: DeepSeek_v3_Neural</span>
            <span class="w-1 h-1 bg-blue-900 rounded-full"></span>
            <span id="uptime-clock">00:00:00</span>
        </div>
    </div>

    <script>
        // --- Game Clock & Uptime ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toISOString().replace('T', ' ').substring(0, 19);
        }

        let startTime = Date.now();
        function updateUptime() {
            let diff = Math.floor((Date.now() - startTime) / 1000);
            let h = Math.floor(diff / 3600); diff %= 3600;
            let m = Math.floor(diff / 60);
            let s = diff % 60;
            document.getElementById('uptime-clock').innerText =
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        setInterval(updateClock, 1000);
        setInterval(updateUptime, 1000);
        updateClock(); updateUptime();

        // --- Fake Game Logs ---
        const logs = ["KERNEL STARTED", "NEURAL PATHWAY STABLE", "AW GATEWAY OPEN", "SYNCING ARCHIVE..."];
        let logIndex = 0;
        function addLog() {
            const container = document.getElementById('live-log');
            const p = document.createElement('p');
            p.className = 'log-entry text-blue-900';
            p.innerText = logs[logIndex % logs.length];
            container.prepend(p);
            // Limit entries
            if (container.childNodes.length > 2) container.removeChild(container.lastChild);
            logIndex++;
        }
        setInterval(addLog, 4000);

        // --- 🕹️ 3D TILT EFFECT JS ---
        const cards = document.querySelectorAll('.menu-card');
        const container = document.getElementById('game-grid');

        // Prevent tilt on disabled cards
        container.addEventListener('mousemove', (e) => {
            const el = e.target.closest('.menu-card');
            if (!el || el.classList.contains('cursor-not-allowed')) return;

            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left; //x position within the element.
            const y = e.clientY - rect.top;  //y position within the element.

            // Calculate center offset (-0.5 to 0.5)
            const xc = ((x / rect.width) - 0.5);
            const yc = ((y / rect.height) - 0.5);

            // Rotation amount (degrees)
            const tiltX = yc * -30; // Max tilt up/down 15deg
            const tiltY = xc * 30;  // Max tilt left/right 15deg

            el.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.02)`;
        });

        // Reset Tilt on mouse leave
        container.addEventListener('mouseout', (e) => {
            const el = e.target.closest('.menu-card');
            if (el) el.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
        });

        // Language switching
        const langData = {
            zh: {
                dashboard_title: '控制中枢',
                behavior_audit: '行为审计',
                audit_desc: 'Quantify your digital footprint via AW',
                digital_avatar: '数字化身',
                avatar_desc: 'Neural Mapping Archive [Status: SECURE]',
                settings: '高级设置',
                settings_desc: 'Neural Tuning & Source Dispatcher'
            },
            en: {
                dashboard_title: 'Control Center',
                behavior_audit: 'Behavioral Audit',
                audit_desc: 'Quantify your digital footprint via AW',
                digital_avatar: 'Digital Avatar',
                avatar_desc: 'Neural Mapping Archive [Status: SECURE]',
                settings: 'Advanced Settings',
                settings_desc: 'Neural Tuning & Source Dispatcher'
            }
        };

        let currentLang = 'zh';

        function changeLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'ENGLISH' : '中文';
            
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                if (langData[currentLang][key]) {
                    element.textContent = langData[currentLang][key];
                }
            });
        }

        document.getElementById('lang-btn').addEventListener('click', changeLanguage);

    </script>
</body>
</html>
