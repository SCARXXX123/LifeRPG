<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeRPG | SOURCE_ENTRY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            background-color: #020205;
            color: #00f2ff;
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 装饰背景：扫描线效果 */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 语言切换按钮 */
        .lang-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00f2ff;
            color: #00f2ff;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 30;
        }

        .lang-btn:hover {
            background: #00f2ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 20px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px #00f2ff;
            text-transform: uppercase;
            font-weight: 900;
            font-style: italic;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #444;
            margin-bottom: 60px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* 按钮容器 */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 1s ease-out;
            z-index: 20;
        }

        button {
            background: rgba(0, 0, 0, 0.6);
            padding: 22px 60px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 4px;
            min-width: 380px;
            font-weight: bold;
            outline: none;
        }

        /* 继续旅程（登录）：青色 */
        .login-btn {
            border: 1px solid #00f2ff;
            color: #00f2ff;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .login-btn:hover {
            background: #00f2ff;
            color: #000;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.6);
            transform: translateY(-2px);
        }

        /* 开启新旅程（注册）：品红 */
        .reg-btn {
            border: 1px solid #ff0055;
            color: #ff0055;
            box-shadow: inset 0 0 10px rgba(255, 0, 85, 0.1);
        }

        .reg-btn:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.6);
            transform: translateY(-2px);
        }

        /* 装饰角标 */
        button::after {
            content: ">>";
            position: absolute;
            right: 20px;
            opacity: 0.3;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-info {
            position: absolute;
            bottom: 30px;
            font-size: 10px;
            color: #333;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 鼠标点击反馈 */
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <button class="lang-btn" id="lang-btn">ENGLISH</button>

    <h1>LifeRPG</h1>
    <div class="subtitle" data-lang="subtitle">Reality Quantification & Soul Audit System</div>

    <div class="btn-container">
        <button class="login-btn" onclick="pywebview.api.navigate('login')" data-lang="continue">
            继续旅程 (CONTINUE_SESSION)
        </button>

        <button class="reg-btn" onclick="pywebview.api.navigate('initialize')" data-lang="new_awake">
            开启新旅程 (NEW_AWAKE)
        </button>
    </div>

    <div class="footer-info" data-lang="status">
        [ SYSTEM_STATUS: READY ] &nbsp; | &nbsp; [ ENCRYPTION: ACTIVE ]
    </div>

    <script>
        const langData = {
            zh: {
                subtitle: 'Reality Quantification & Soul Audit System',
                continue: '继续旅程 (CONTINUE_SESSION)',
                new_awake: '开启新旅程 (NEW_AWAKE)',
                status: '[ SYSTEM_STATUS: READY ] &nbsp; | &nbsp; [ ENCRYPTION: ACTIVE ]'
            },
            en: {
                subtitle: 'Reality Quantification & Soul Audit System',
                continue: 'Continue Journey (CONTINUE_SESSION)',
                new_awake: 'Start New Journey (NEW_AWAKE)',
                status: '[ SYSTEM_STATUS: READY ] &nbsp; | &nbsp; [ ENCRYPTION: ACTIVE ]'
            }
        };

        let currentLang = 'zh';

        function changeLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn').textContent = currentLang === 'zh' ? 'ENGLISH' : '中文';
            
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                if (langData[currentLang][key]) {
                    element.textContent = langData[currentLang][key];
                }
            });
        }

        document.getElementById('lang-btn').addEventListener('click', changeLanguage);

        // 预留接口：如果需要根据 pywebview 状态做额外动画可以在此处理
        window.addEventListener('pywebviewready', function() {
            console.log("LifeRPG Interface Initialized...");
        });
    </script>
</body>
</html>
